apiVersion: v1
kind: Service
metadata:
  name: tradeflow-service
  namespace: tradeflow
  labels:
    app: tradeflow-api
spec:
  selector:
    app: tradeflow-api
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: tradeflow-ui-service
  namespace: tradeflow
  labels:
    app: tradeflow-ui
spec:
  selector:
    app: tradeflow-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer

name: TradeFlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_IMAGE: abdulfaizan0123/tradeflow

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tradeflow
          POSTGRES_PASSWORD: tradeflow_pass
          POSTGRES_DB: tradeflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run tests
      env:
        DATABASE_URL: postgresql://tradeflow:tradeflow_pass@localhost:5432/tradeflow_db
      run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # THIS IS THE FIX: Using the native Docker command instead of the broken action
    - name: Log in to Docker Hub
      run: echo "dckr_pat_vPGJwXEgTgm6mO55ES5LZeThIGU" | docker login -u abdulfaizan0123 --password-stdin
      
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE }}:latest
          ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  notify:
    needs: [test, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Send Slack Notification
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
        SLACK_TITLE: 'TradeFlow Pipeline Status'
        SLACK_MESSAGE: 'Pipeline finished with status: ${{ job.status }} for commit ${{ github.sha }}'
